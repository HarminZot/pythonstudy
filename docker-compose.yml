services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pythonstudy
      POSTGRES_USER: pythonstudy
      POSTGRES_PASSWORD: pythonstudy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythonstudy"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      APP_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://pythonstudy:pythonstudy@db:5432/pythonstudy
      CODE_MEMORY_MB: 256
      CODE_TIMEOUT_SECONDS: 3
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage/uploads
      - generated:/app/storage/generated
      - temp:/app/storage/temp
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
  generated:
  temp:
