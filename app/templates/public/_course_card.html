<article class="course-card">
  <div class="course-cover">
    {% if course.cover_path %}
      <img src="{{ url_for('public.course_cover', course_id=course.id) }}"
           alt="Обложка курса {{ course.title }}">
    {% else %}PY{% endif %}
  </div>
  <div class="course-content">
    <span class="badge">{{ course.difficulty }}</span>
    <h3>
      <a href="{{ url_for('public.course_detail', slug=course.slug) }}">{{ course.title }}</a>
    </h3>
    <p>{{ course.short_description }}</p>
    <div class="meta">
      <span>{{ course.lessons_count }} уроков</span>
      <span>{{ course.estimated_hours }} ч.</span>
    </div>
  </div>
</article>
