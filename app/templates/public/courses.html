{% extends 'base.html' %}
{% block title %}Каталог курсов{% endblock %}
{% block content %}
  <div class="page-title">
    <h1>Каталог курсов</h1>
    <p>Опубликованные программы изучения Python.</p>
  </div>
  <form method="get" class="catalog-filters">
    <label>
      Поиск
      <input type="search" name="q" value="{{ search }}" placeholder="Название или описание">
    </label>
    <label>
      Уровень
      <select name="difficulty">
        <option value="">Все уровни</option>
        <option value="beginner" {% if difficulty == 'beginner' %}selected{% endif %}>Начальный</option>
        <option value="intermediate" {% if difficulty == 'intermediate' %}selected{% endif %}>Средний</option>
        <option value="advanced" {% if difficulty == 'advanced' %}selected{% endif %}>Продвинутый</option>
      </select>
    </label>
    <label>
      Преподаватель
      <select name="teacher">
        <option value="">Все преподаватели</option>
        {% for teacher in teachers %}
          <option value="{{ teacher.id }}" {% if teacher_id == teacher.id %}selected{% endif %}>{{ teacher.full_name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Сортировка
      <select name="sort">
        <option value="title" {% if sort == 'title' %}selected{% endif %}>По названию</option>
        <option value="newest" {% if sort == 'newest' %}selected{% endif %}>Сначала новые</option>
        <option value="popular" {% if sort == 'popular' %}selected{% endif %}>По популярности</option>
      </select>
    </label>
    <button class="button" type="submit">Применить</button>
  </form>
  <div class="card-grid">
    {% for course in courses %}
      {% include 'public/_course_card.html' %}
    {% else %}
      <div class="empty">По заданным условиям курсы не найдены.</div>
    {% endfor %}
  </div>
{% endblock %}
