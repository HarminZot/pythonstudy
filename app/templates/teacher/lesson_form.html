{% extends 'base.html' %}
{% block title %}Редактирование урока{% endblock %}
{% block content %}
  <div class="narrow wide">
    <h1>Редактирование урока</h1>
    <form method="post" enctype="multipart/form-data" class="form-card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        Название
        <input name="title" value="{{ lesson.title }}" required>
      </label>
      <label>
        Краткое описание<textarea name="summary">{{ lesson.summary }}</textarea>
      </label>
      <label>
        Материал HTML<textarea name="content" rows="18">{{ lesson.content }}</textarea>
      </label>
      <div class="form-grid">
        <label>
          Тип
          <select name="lesson_type">
            <option value="theory">Теория</option>
            <option value="practice">Практика</option>
            <option value="mixed">Смешанный</option>
          </select>
        </label>
        <label>
          Минут
          <input type="number" name="estimated_minutes" value="{{ lesson.estimated_minutes }}">
        </label>
      </div>
      <label>
        Название материала
        <input name="material_title" placeholder="Дополнительный материал">
      </label>
      <label>
        Файл материала
        <input type="file"
               name="material"
               accept=".pdf,.docx,.xlsx,.txt,.csv,.png,.jpg,.jpeg,.zip,.py">
      </label>
      <label class="checkbox">
      <input type="checkbox"
             name="is_published"
             {% if lesson.is_published %}checked{% endif %}> Опубликован</label>
      <button class="button">Сохранить</button>
    </form>
  </div>
{% endblock %}
