{% extends 'base.html' %}{% block title %}Все курсы{% endblock %}{% block content %}<div class="page-title"><h1>Все курсы</h1></div><table><thead><tr><th>Название</th><th>Преподаватель</th><th>Статус</th><th>Студенты</th><th></th></tr></thead><tbody>{% for course in courses %}<tr><td>{{ course.title }}</td><td>{{ course.teacher.full_name }}</td><td>{{ course.status }}</td><td>{{ course.enrollments|length }}</td><td><a href="{{ url_for('teacher.course_edit', course_id=course.id) }}">Открыть</a></td></tr>{% endfor %}</tbody></table>{% endblock %}
