{% extends 'base.html' %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
  <div class="auth-card">
    <h1>Новый пароль</h1>
    <form method="post">
      {{ form.hidden_tag() }}
      <label>{{ form.password.label }}{{ form.password() }}</label>
      <label>{{ form.password_repeat.label }}{{ form.password_repeat() }}</label>
      {{ form.submit(class='button full') }}
    </form>
  </div>
{% endblock %}
