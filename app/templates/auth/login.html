{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
  <div class="auth-card">
    <h1>Вход</h1>
    {% include 'partials/form_errors.html' %}
    <form method="post">
      {{ form.hidden_tag() }}
      <label>{{ form.email.label }}{{ form.email(autocomplete='username') }}</label>
      <label>{{ form.password.label }}{{ form.password(autocomplete='current-password') }}</label>
      <label class="checkbox">{{ form.remember() }} {{ form.remember.label.text }}</label>
      {{ form.submit(class='button full') }}
    </form>
    <p>
      <a href="{{ url_for('auth.forgot_password') }}">Забыли пароль?</a>
    </p>
    <p>
      Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a>
    </p>
  </div>
{% endblock %}
