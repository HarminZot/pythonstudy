{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
  <div class="auth-card wide">
    <h1>Регистрация студента</h1>
    {% include 'partials/form_errors.html' %}
    <form method="post" class="form-grid">
      {{ form.hidden_tag() }}
      <label>{{ form.last_name.label }}{{ form.last_name() }}</label>
      <label>{{ form.first_name.label }}{{ form.first_name() }}</label>
      <label>{{ form.middle_name.label }}{{ form.middle_name() }}</label>
      <label>{{ form.email.label }}{{ form.email() }}</label>
      <label>{{ form.password.label }}{{ form.password() }}</label>
      <label>{{ form.password_repeat.label }}{{ form.password_repeat() }}</label>
      <div class="span-2">{{ form.submit(class='button') }}</div>
    </form>
  </div>
{% endblock %}
