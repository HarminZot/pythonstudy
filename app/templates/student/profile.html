{% extends 'base.html' %}{% block title %}Профиль{% endblock %}{% block content %}<div class="narrow"><h1>Профиль пользователя</h1>{% if current_user.avatar_path %}<img class="profile-avatar" src="{{ url_for('student.avatar', user_id=current_user.id) }}" alt="Аватар {{ current_user.full_name }}">{% endif %}<form method="post" enctype="multipart/form-data" class="form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Фамилия<input name="last_name" value="{{ current_user.last_name }}" required></label><label>Имя<input name="first_name" value="{{ current_user.first_name }}" required></label><label>Отчество<input name="middle_name" value="{{ current_user.middle_name or '' }}"></label><label>Электронная почта<input value="{{ current_user.email }}" disabled></label><label>Аватар<input type="file" name="avatar" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG или WEBP</small></label><label>Новый пароль<input type="password" name="new_password" minlength="8"></label><button class="button" type="submit">Сохранить</button></form></div>{% endblock %}
